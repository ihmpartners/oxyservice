<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OxyService</title>
<meta name="description" content="Oxygen transfill log with tax-year accounts">
<meta name="theme-color" content="#1a56b0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OxyService">
<style>
:root{
  --bg:#f2f5f9; --card:#ffffff; --ink:#121b2b; --muted:#5a6678; --line:#d6dde8;
  --accent:#1a56b0; --accent-ink:#ffffff; --head:#1a56b0; --accent-soft:#e3ecfa;
  --good:#1d7a3e; --bad:#b4342a; --warn:#a86a00;
  --gauge:#1a56b0; --gauge-low:#c9822b; --gauge-crit:#b4342a;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d131c; --card:#161e2a; --ink:#e6ecf5; --muted:#92a0b4; --line:#283345;
    --accent:#6ea8ff; --accent-ink:#071a36; --head:#173a72; --accent-soft:#1a2840;
    --good:#5cc27f; --bad:#ef7d72; --warn:#e0a84a; --gauge:#6ea8ff;
  }
}
:root[data-theme="dark"]{
  --bg:#0d131c; --card:#161e2a; --ink:#e6ecf5; --muted:#92a0b4; --line:#283345;
  --accent:#6ea8ff; --accent-ink:#071a36; --head:#173a72; --accent-soft:#1a2840;
  --good:#5cc27f; --bad:#ef7d72; --warn:#e0a84a; --gauge:#6ea8ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
header select{background:rgba(255,255,255,.15);color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 8px;font:inherit;font-size:14px}
header select option{color:#000}
.pill{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap;border:0;color:inherit;font-family:inherit;cursor:pointer}
.pill.err{background:#b4342a;color:#fff}
main{max-width:780px;margin:0 auto;padding:14px 16px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 2px 12px;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:10px 11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[type=checkbox]{display:inline;width:auto;margin:0 8px 0 0}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 12px 2px;margin:4px 0 12px}
legend{font-size:13px;font-weight:600;padding:0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid2>label,.grid3>label{min-width:0}
input,select{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b{font:inherit;font-size:15px;border-radius:9px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{padding:6px 10px;font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.list li:first-child{border-top:0}
.list .main{flex:1;min-width:0}
.list .t{font-weight:600}
.list .s{font-size:13px;color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .x{font-size:12px;color:var(--muted)}
.mani{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.cyl{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.cyl .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tube{width:38px;height:110px;border:2px solid var(--line);border-radius:14px 14px 8px 8px;position:relative;overflow:hidden;background:var(--bg)}
.tube::before{content:"";position:absolute;top:-2px;left:12px;width:10px;height:6px;background:var(--line)}
.tube i{position:absolute;left:0;right:0;bottom:0;background:var(--gauge)}
.tube i.low{background:var(--gauge-low)} .tube i.crit{background:var(--gauge-crit)}
.cyl .p{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.cyl .p small{font-size:12px;font-weight:500;color:var(--muted)}
.cyl .meta{font-size:12px;color:var(--muted);line-height:1.35}
.cyl.empty .tube{border-style:dashed}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}
@media (max-width:520px){.wide{display:none}}
td.desc{white-space:normal;min-width:130px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:16px;font-size:14px;z-index:9;max-width:calc(100vw - 32px);width:max-content;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.warn{color:var(--warn);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;vertical-align:middle}
.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
h2 .chip{font-size:12px}
.sys{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.sys .tile{display:flex;flex-direction:column;gap:4px}
.sys .nm{font-weight:700;font-size:15px}
.sys .s{font-size:12px;color:var(--muted);line-height:1.35}
.sys button{margin-top:auto;align-self:flex-start}
@media (min-width:640px){.sys{grid-template-columns:repeat(4,1fr)}}
@media (max-width:420px){nav button{font-size:11px;padding:10px 0 12px}}
.empty-note{padding:18px 0;text-align:center;color:var(--muted)}
@media (max-width:420px){.mani{gap:6px}.cyl{padding:10px 6px}.tile .v{font-size:19px}}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <h1>OxyService</h1>
  <select id="yearSel" aria-label="Tax year"></select>
  <button class="pill" id="syncPill" title="Sync now">Local only</button>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="hire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15h3"/></svg>Hire</button>
  <button data-tab="fill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Fill</button>
  <button data-tab="service"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg>Service</button>
  <button data-tab="manifold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="5" height="14" rx="2"/><rect x="9.5" y="7" width="5" height="14" rx="2"/><rect x="16" y="7" width="5" height="14" rx="2"/><path d="M5.5 7V4h13v3"/></svg>Manifold</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Log</button>
  <button data-tab="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Accounts</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
const APP_VERSION = '2026-11-04 (tab order)';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const money = n => (n < 0 ? '−' : '') + '£' + Math.abs(+n || 0).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
const pad = n => String(n).padStart(2, '0');
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const fmtDate = ds => ds ? new Date(ds + 'T12:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
// UK tax year: 1 April – 31 March. Year key = calendar year in which it starts.
const taxYearOf = ds => { const [y, m] = ds.split('-').map(Number); return m >= 4 ? y : y - 1; };
const tyLabel = y => `${y}/${pad((y + 1) % 100)}`;
const tyRange = y => `1 Apr ${y} – 31 Mar ${y + 1}`;
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); }));
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), msg.length > 60 ? 7000 : 2200); }

/* ================= storage (IndexedDB) ================= */
const IDB = {
  db: null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open('oxyservice', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('records', {keyPath:'id'}); r.result.createObjectStore('meta'); };
    r.onsuccess = () => { this.db = r.result; res(); };
    r.onerror = () => rej(r.error);
  }); },
  tx(store, mode, fn){ return new Promise((res, rej) => {
    const t = this.db.transaction(store, mode); const s = t.objectStore(store); const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error);
  }); },
  all(){ return this.tx('records', 'readonly', s => s.getAll()); },
  put(rec){ return this.tx('records', 'readwrite', s => s.put(rec)); },
  putMany(recs){ return this.tx('records', 'readwrite', s => { recs.forEach(r => s.put(r)); }); },
  getMeta(k){ return this.tx('meta', 'readonly', s => s.get(k)); },
  setMeta(k, v){ return this.tx('meta', 'readwrite', s => s.put(v, k)); },
};

/* ================= state ================= */
// Each record: {id, kind, data, updated_at, deleted, dirty}
// kinds: fill | swap | service | hire | entry (rental / other cost / other income / mileage) | settings
const S = { recs: new Map(), meta: {}, tab: 'fill', year: null, edit: null, swapPos: null, hireSys: null, q: '', sq: '', hq: '' };
const DEFAULTS = { unit: 'psi', fullPressure: 2200, lowPressure: 500, defaultCharge: 25, defaultRefillCost: 46.86,
  sizes: ['Ultra-lite', 'CD', 'D', 'E', 'F', '2 L', '3 L', '5 L', '7 L', '10 L', '12 L'],
  // HMRC approved mileage rates 2026/27: 55p for the first 10,000 business miles in the tax year, 25p after
  mileageRate: 0.55, mileageRateHigh: 0.25, mileageThreshold: 10000, defaultServiceCharge: null, testIntervalYears: 5,
  hirePrices: { 1: { day: 20, weekend: 50, week: 110 }, 2: { day: 35, weekend: 75, week: 185 } } };
const HIRE_SYSTEMS = [ { id: 'S1', name: 'Single 1', places: 1 }, { id: 'S2', name: 'Single 2', places: 1 },
  { id: 'S3', name: 'Single 3', places: 1 }, { id: 'T1', name: 'Two-place', places: 2 } ];
const HIRE_PERIODS = { day: 'Day', weekend: 'Weekend', week: 'Week' };
const HIRE_DAYS = { day: 1, weekend: 3, week: 7 }; // default length used to suggest the return date
const HIRE_STATUS = { booked: 'Booked', out: 'On hire', returned: 'Returned' };
const sysOf = id => HIRE_SYSTEMS.find(x => x.id === id) || HIRE_SYSTEMS[0];
const WORK_TYPES = ['Test & certification', 'Visual inspection', 'Valve service', 'Valve replacement', 'Test & valve service'];
const SERVICE_STATUS = { in: 'In for service', ready: 'Ready to collect', returned: 'Returned' };
const settings = () => Object.assign({}, DEFAULTS, S.recs.get('settings')?.data || {});
const live = kind => [...S.recs.values()].filter(r => r.kind === kind && !r.deleted).map(r => ({...r.data, id: r.id}));
const getData = id => { const r = S.recs.get(id); return r && !r.deleted ? {...r.data, id} : null; };
const ord = (a, b) => (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0);

async function save(kind, data, id){
  const prev = id && S.recs.get(id);
  const rec = { id: id || uuid(), kind, data: {...(prev?.data || {}), ...data, created: prev?.data?.created || Date.now()},
                updated_at: Date.now(), deleted: 0, dirty: 1 };
  delete rec.data.id;
  S.recs.set(rec.id, rec); await IDB.put(rec); scheduleSync(); return rec;
}
async function remove(id){
  const r = S.recs.get(id); if (!r) return;
  Object.assign(r, { deleted: 1, updated_at: Date.now(), dirty: 1 });
  await IDB.put(r); scheduleSync();
}

/* ================= derived data ================= */
function manifold(){
  // Walk swaps and fills in date order to get the live state of each manifold position.
  const pos = {1:null, 2:null, 3:null};
  const ev = [...live('swap').map(s => ({...s, _t:'swap'})), ...live('fill').map(f => ({...f, _t:'fill'}))].sort(ord);
  for (const e of ev){
    if (e._t === 'swap'){
      pos[e.position] = e.empty ? null : { serial: e.serial, fitted: e.date, pressure: num(e.pressure), pDate: e.date, fills: 0, swapId: e.id };
    } else {
      for (const p of [1,2,3]){
        const v = num(e.manifold?.[p]);
        if (pos[p]) { if (v != null) { pos[p].pressure = v; pos[p].pDate = e.date; } pos[p].fills++; }
      }
    }
  }
  return pos;
}
const nextFillNo = () => live('fill').reduce((m, f) => Math.max(m, num(f.no) || 0), 0) + 1;
function customers(){
  const m = new Map();
  [...live('fill'), ...live('service'), ...live('hire')].sort(ord).forEach(f => { if (f.customer) m.set(f.customer.trim(), f.phone || m.get(f.customer.trim()) || ''); });
  return m;
}
function years(){
  const ys = new Set([taxYearOf(localToday())]);
  for (const k of ['fill','swap','entry','service','hire']) live(k).forEach(r => r.date && ys.add(taxYearOf(r.date)));
  return [...ys].sort((a, b) => b - a);
}
const inYear = (r, y) => r.date && taxYearOf(r.date) === y;
const ENTRY_TYPES = { rental: 'Cylinder rental', cost: 'Other cost / toll', income: 'Other income', mileage: 'Business mileage' };

function ledger(y){
  const rows = [];
  live('fill').filter(f => inYear(f, y)).forEach(f => rows.push({ date: f.date, created: f.created, id: f.id, kind: 'fill',
    desc: `Fill #${f.no ?? '?'}${f.customer ? ' – ' + f.customer : ''}`, inc: num(f.charge) || 0, cost: 0 }));
  live('swap').filter(s => inYear(s, y) && num(s.cost)).forEach(s => rows.push({ date: s.date, created: s.created, id: s.id, kind: 'swap',
    desc: `Cylinder ${s.position} refill${s.serial ? ' (' + s.serial + ')' : ''}`, inc: 0, cost: num(s.cost) }));
  live('entry').filter(e => inYear(e, y)).forEach(e => {
    if (e.type === 'mileage') { rows.push({ date: e.date, created: e.created, id: e.id, kind: 'entry', cat: 'mileage', miles: num(e.amount) || 0,
      desc: 'Business mileage' + (e.desc ? ' – ' + e.desc : ''), inc: 0, cost: 0 }); return; }
    rows.push({ date: e.date, created: e.created, id: e.id, kind: 'entry', cat: e.type === 'rental' ? 'rental' : e.type === 'income' ? 'otherInc' : 'other',
      desc: (ENTRY_TYPES[e.type] || 'Entry') + (e.desc ? ' – ' + e.desc : ''), inc: e.type === 'income' ? (num(e.amount) || 0) : 0,
      cost: e.type === 'income' ? 0 : (num(e.amount) || 0) });
  });
  live('service').filter(s => inYear(s, y)).forEach(s => {
    const who = s.customer || s.serial || 'cylinder';
    const base = { date: s.date, created: s.created, id: s.id, kind: 'service' };
    rows.push({ ...base, cat: 'service', desc: `Service – ${who}${s.work ? ' (' + s.work + ')' : ''}`, inc: num(s.charge) || 0, cost: 0 });
    if (num(s.tolls)) rows.push({ ...base, created: (s.created || 0) + .1, cat: 'tolls', desc: `Tolls – ${who}`, inc: 0, cost: num(s.tolls) });
    if (num(s.otherCost)) rows.push({ ...base, created: (s.created || 0) + .2, cat: 'other', desc: `${s.otherDesc || 'Service cost'} – ${who}`, inc: 0, cost: num(s.otherCost) });
    if (num(s.miles)) rows.push({ ...base, created: (s.created || 0) + .3, cat: 'mileage', miles: num(s.miles), desc: `Mileage – ${who}`, inc: 0, cost: 0 });
  });
  live('hire').filter(h => inYear(h, y)).forEach(h => rows.push({ date: h.date, created: h.created, id: h.id, kind: 'hire', cat: 'hire',
    desc: `Hire – ${sysOf(h.system).name}, ${hireLen(h)}${h.customer ? ' – ' + h.customer : ''}`, inc: num(h.charge) || 0, cost: 0 }));
  rows.sort(ord);
  // Mileage allowance: standard rate up to the threshold in the tax year, lower rate after it.
  const st = settings(); let miles = 0;
  rows.forEach(r => {
    if (r.cat !== 'mileage') return;
    const low = Math.max(0, Math.min(r.miles, st.mileageThreshold - miles));
    r.cost = Math.round((low * st.mileageRate + (r.miles - low) * st.mileageRateHigh) * 100) / 100;
    r.desc += ` · ${r.miles} mi`; miles += r.miles;
  });
  let ci = 0, cc = 0;
  rows.forEach(r => { ci += r.inc; cc += r.cost; r.runInc = ci; r.runCost = cc; r.runNet = ci - cc; });
  return rows;
}
function totals(y){
  const L = ledger(y);
  const t = { returns: 0, fillReturns: 0, serviceReturns: 0, otherReturns: 0, refills: 0, rentals: 0, other: 0, tolls: 0,
              miles: 0, mileage: 0, fills: 0, services: 0, refillCount: 0, hireReturns: 0, hires: 0 };
  L.forEach(r => {
    t.returns += r.inc;
    if (r.kind === 'fill') { t.fillReturns += r.inc; t.fills++; }
    else if (r.kind === 'swap') { t.refills += r.cost; t.refillCount++; }
    else if (r.cat === 'service') { t.serviceReturns += r.inc; t.services++; }
    else if (r.cat === 'hire') { t.hireReturns += r.inc; t.hires++; }
    else if (r.cat === 'otherInc') t.otherReturns += r.inc;
    else if (r.cat === 'rental') t.rentals += r.cost;
    else if (r.cat === 'tolls') t.tolls += r.cost;
    else if (r.cat === 'mileage') { t.miles += r.miles; t.mileage += r.cost; }
    else t.other += r.cost;
  });
  // swaps with no cost still count as cylinder changes
  t.swaps = live('swap').filter(s => inYear(s, y) && !s.empty).length;
  t.costs = t.refills + t.rentals + t.other + t.tolls; t.cashNet = t.returns - t.costs; t.net = t.cashNet - t.mileage;
  return t;
}
function certifications(){
  // Latest certification per cylinder (by serial, else per job), soonest due first.
  const m = new Map();
  live('service').filter(s => s.nextDue).sort((a, b) => (a.certDate || a.date).localeCompare(b.certDate || b.date))
    .forEach(s => m.set(s.serial ? s.serial.trim().toUpperCase() : s.id, s));
  const today = localToday();
  return [...m.values()].map(s => ({ ...s, days: Math.round((new Date(s.nextDue + 'T12:00:00') - new Date(today + 'T12:00:00')) / 864e5) }))
    .sort((a, b) => a.nextDue.localeCompare(b.nextDue));
}

// Bookings that overlap. A system can go out the same day the previous hire comes back.
function hireClash(sys, start, end, exclude){
  if (!sys || !start) return null; end = end && end >= start ? end : start;
  return live('hire').find(h => h.id !== exclude && h.system === sys && h.status !== 'returned' &&
    h.date < (end === start ? addDays(start, 1) : end) && start < ((h.end && h.end > h.date) ? h.end : addDays(h.date, 1))) || null;
}
function hireState(h, today = localToday()){

  if (h.date < today) return { cls: 'chip bad', txt: 'Not collected' };
  return { cls: 'chip', txt: h.date === today ? 'Going out today' : 'Booked' };
}

function wireHire(){
  const f = $('#fHire'); if (!f) return;
  const custs = customers(), editing = S.edit?.kind === 'hire' ? S.edit.id : null;
  f.customer.addEventListener('change', () => { const p = custs.get(f.customer.value.trim()); if (p && !f.phone.value) f.phone.value = p; });
  const qty = () => Math.max(1, Math.round(num(f.qty.value) || 1));
  const price = () => { const each = hirePrice(f.system.value, f.period.value), q = qty();
    $('#hPrice').textContent = `${HIRE_PERIODS[f.period.value]} rate for ${sysOf(f.system.value).places === 1 ? 'a single place' : 'the 2 place'} system: ${money(each)}${q > 1 ? ` × ${q} = ${money(each * q)}` : ''}. You can change the charge.`;
    return each * q; };
  const check = () => {
    const c = hireClash(f.system.value, f.date.value, f.end.value, editing);
    $('#hWarn').textContent = f.end.value && f.date.value && f.end.value < f.date.value ? 'The finish date is before the start date.'
      : c ? `${sysOf(c.system).name} is already booked ${fmtDate(c.date)} → ${fmtDate(c.end)}${c.customer ? ' for ' + c.customer : ''}.` : '';
  };
  // Changing the system, period, length or start suggests a finish date and recalculates the charge.
  const recalc = () => { if (f.date.value) f.end.value = addDays(f.date.value, qty() * HIRE_DAYS[f.period.value]); f.charge.value = price().toFixed(2); check(); };
  ['system', 'period', 'qty', 'date'].forEach(n => f[n].addEventListener('change', recalc));
  f.qty.addEventListener('input', () => { if (num(f.qty.value)) recalc(); });
  // Changing the finish date works out how many days or weeks that is.
  f.end.addEventListener('change', () => {
    const days = f.date.value && f.end.value ? dayDiff(f.date.value, f.end.value) : 0;
    if (days > 0 && f.period.value !== 'weekend') { f.qty.value = Math.max(1, Math.ceil(days / HIRE_DAYS[f.period.value])); f.charge.value = price().toFixed(2); }
    check();
  });
  price(); check();
}

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'cancel') { S.edit = null; S.swapPos = null; S.hireSys = null; render(); }
  else if (a === 'delete') {
    if (!confirm('Delete this record?')) return;
    await remove(id); S.edit = null; S.swapPos = null; S.hireSys = null; toast('Deleted'); render();
  }
  else if (a === 'editFill') { S.edit = {kind:'fill', id}; S.tab = 'fill'; render(); scrollTo(0, 0); }
  else if (a === 'editSwap') { S.edit = {kind:'swap', id}; S.swapPos = null; render(); scrollTo(0, 0); }
  else if (a === 'swap') { S.edit = null; S.swapPos = +el.dataset.pos; render(); $('#fSwap')?.scrollIntoView({behavior:'smooth'}); }
  else if (a === 'editLedger') {
    const k = el.dataset.kind; S.edit = {kind:k, id};
    S.tab = k === 'fill' ? 'fill' : k === 'swap' ? 'manifold' : k === 'service' ? 'service' : k === 'hire' ? 'hire' : 'accounts'; render(); scrollTo(0, 0);
  }
  else if (a === 'editService') { S.edit = {kind:'service', id}; S.tab = 'service'; render(); scrollTo(0, 0); }
  else if (a === 'editHire') { S.edit = {kind:'hire', id}; S.tab = 'hire'; render(); scrollTo(0, 0); }
  else if (a === 'hireBook') { S.edit = null; S.hireSys = el.dataset.sys; render(); $('#fHire')?.scrollIntoView({behavior:'smooth'}); }
  else if (a === 'hireStatus') {
    const h = getData(id); if (!h) return;
    await save('hire', { status: el.dataset.to }, id);
    toast(`${sysOf(h.system).name} ${el.dataset.to === 'out' ? 'marked out on hire' : 'returned'}`); render();
  }
  else if (a === 'csvHire') exportHireCsv();
  else if (a === 'csv') exportCsv();
  else if (a === 'csvService') exportServiceCsv();
  else if (a === 'exportJson') exportJson();
});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target, v = n => f[n]?.value?.trim() ?? '';
  if (f.id === 'fFill') {
    const st = settings(), m = manifold(), man = {};
    [1,2,3].forEach(p => { if (f['m' + p]) man[p] = num(v('m' + p)); });
    const editing = S.edit?.kind === 'fill' ? S.edit.id : null;
    const dup = live('fill').find(x => +x.no === +v('no') && x.id !== editing);
    if (dup && !confirm(`Fill #${v('no')} already exists. Save anyway?`)) return;
    await save('fill', { no: num(v('no')), date: v('date'), customer: v('customer'), phone: v('phone'), size: v('size'),
      startP: num(v('startP')), finalP: num(v('finalP')), charge: num(v('charge')), manifold: man, notes: v('notes') }, editing);
    S.edit = null; toast(editing ? 'Fill updated' : 'Fill saved'); render(); scrollTo(0, 0);
  }
  else if (f.id === 'fSwap') {
    const editing = S.edit?.kind === 'swap' ? S.edit.id : null;
    await save('swap', { position: +v('position'), date: v('date'), empty: f.empty.checked, serial: v('serial'),
      pressure: num(v('pressure')), cost: num(v('cost')), notes: v('notes') }, editing);
    S.edit = null; S.swapPos = null; toast('Cylinder change saved'); render();
  }
  else if (f.id === 'fService') {
    const editing = S.edit?.kind === 'service' ? S.edit.id : null;
    await save('service', { date: v('date'), status: v('status'), customer: v('customer'), phone: v('phone'), size: v('size'),
      serial: v('serial'), work: v('work'), certDate: v('certDate'), nextDue: v('nextDue'), charge: num(v('charge')),
      miles: num(v('miles')), tolls: num(v('tolls')), otherCost: num(v('otherCost')), otherDesc: v('otherDesc'), notes: v('notes') }, editing);
    S.edit = null; toast(editing ? 'Service job updated' : 'Service job saved'); render(); scrollTo(0, 0);
  }
  else if (f.id === 'fHire') {
    const editing = S.edit?.kind === 'hire' ? S.edit.id : null;
    if (v('end') < v('date')) { alert('The finish date is before the start date.'); return; }
    const c = hireClash(v('system'), v('date'), v('end'), editing);
    if (c && !confirm(`${sysOf(c.system).name} is already booked ${fmtDate(c.date)} → ${fmtDate(c.end)}${c.customer ? ' for ' + c.customer : ''}. Save anyway?`)) return;
    await save('hire', { system: v('system'), status: v('status'), period: v('period'), qty: Math.max(1, Math.round(num(v('qty')) || 1)),
      date: v('date'), end: v('end'), customer: v('customer'), phone: v('phone'), charge: num(v('charge')), notes: v('notes') }, editing);
    S.edit = null; S.hireSys = null; toast(editing ? 'Hire updated' : 'Hire saved'); render(); scrollTo(0, 0);
  }
  else if (f.id === 'fEntry') {
    const editing = S.edit?.kind === 'entry' ? S.edit.id : null;
    await save('entry', { type: v('type'), date: v('date'), desc: v('desc'), amount: num(v('amount')) }, editing);
    S.edit = null; toast('Saved'); render();
  }
  else if (f.id === 'fSettings') {
    await save('settings', { unit: v('unit'), fullPressure: num(v('fullPressure')) || 2200, lowPressure: num(v('lowPressure')) || 0,
      defaultCharge: num(v('defaultCharge')), defaultRefillCost: num(v('defaultRefillCost')),
      defaultServiceCharge: num(v('defaultServiceCharge')), testIntervalYears: num(v('testIntervalYears')) || 5,
      mileageRate: num(v('mileageRate')) ?? 0.55, mileageRateHigh: num(v('mileageRateHigh')) ?? 0.25,
      mileageThreshold: num(v('mileageThreshold')) ?? 10000,
      hirePrices: Object.fromEntries([1, 2].map(n => [n, Object.fromEntries(Object.keys(HIRE_PERIODS).map(k => [k, num(v(`hp${n}_${k}`)) ?? DEFAULTS.hirePrices[n][k]]))])),
      sizes: v('sizes').split('\n').map(s => s.trim()).filter(Boolean) }, 'settings');
    toast('Defaults saved'); render();
  }
  else if (f.id === 'fSync') {
    S.meta.syncUrl = v('url'); S.meta.token = v('token');
    await IDB.setMeta('syncUrl', S.meta.syncUrl); await IDB.setMeta('token', S.meta.token);
    S.meta.lastPull = 0; await IDB.setMeta('lastPull', 0);
    await sync(true); render();
  }
});
document.addEventListener('input', ev => {

  if (ev.target.id === 'importFile') {
    const file = ev.target.files[0]; if (!file) return;
    try {
      const j = JSON.parse(await file.text()); const recs = j.records || [];
      if (!confirm(`Restore ${recs.length} records? Newer records on this device are kept.`)) return;
      let n = 0;
      for (const r of recs) { const cur = S.recs.get(r.id); if (!cur || r.updated_at > cur.updated_at) { const x = {...r, dirty: 1}; S.recs.set(x.id, x); n++; } }
      await IDB.putMany([...S.recs.values()]); toast(`Restored ${n} records`); scheduleSync(); render();
    } catch (e) { alert('Could not read that file: ' + e.message); }
  }
});

function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ================= sync with Cloudflare ================= */
let syncing = false, syncTimer = null;
function scheduleSync(ms = 1500){ clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(false), ms); setPill(); }
function setPill(state){
  const p = $('#syncPill'), pending = [...S.recs.values()].filter(r => r.dirty).length;
  p.classList.remove('err');
  if (!S.meta.token) { p.textContent = 'Local only'; return; }
  if (state === 'syncing') p.textContent = 'Syncing…';
  else if (!navigator.onLine) p.textContent = pending ? `Offline · ${pending} to sync` : 'Offline';
  else if (S.meta.lastError) { p.textContent = 'Sync error'; p.classList.add('err'); }
  else p.textContent = pending ? `${pending} to sync` : 'Synced ✓';
}
async function sync(manual){
  if (syncing || !S.meta.token) { setPill(); return; }
  if (!navigator.onLine) { setPill(); if (manual) toast('Offline — will sync when back online'); return; }
  syncing = true; setPill('syncing');
  try {
    const base = (S.meta.syncUrl || '').replace(/\/+$/, '');
    const url = base ? (base.endsWith('/api/sync') ? base : base + '/api/sync') : 'api/sync';
    const dirty = [...S.recs.values()].filter(r => r.dirty).map(({dirty, ...r}) => r);
    const since = Math.max(0, (S.meta.lastPull || 0) - 60000); // overlap window; applying is idempotent
    const where = new URL(url, location.href).href;
    if (location.protocol === 'file:' && !base) throw new Error('This copy of the app is opened as a file. Open it from your Cloudflare address (…pages.dev), or enter that address as the sync address.');
    let res;
    try {
      res = await fetch(url, { method: 'POST', cache: 'no-store', headers: {'content-type': 'application/json', authorization: 'Bearer ' + S.meta.token.trim()},
        body: JSON.stringify({ since, changes: dirty }) });
    } catch (e) { throw new Error(`Could not reach ${where}. Check the sync address and your connection.`); }
    const text = await res.text(); let out = null;
    try { out = JSON.parse(text); } catch {}
    if (!out) throw new Error(`No sync service found at ${where} (HTTP ${res.status}). The app's "functions" folder may not have been deployed. Deploy with "npx wrangler pages deploy" from the project folder, not by uploading only the public folder.`);
    if (!res.ok) throw new Error(out.error || `Server replied ${res.status}`);
    const changed = [];
    for (const r of dirty) { const cur = S.recs.get(r.id); if (cur && cur.updated_at === r.updated_at) { cur.dirty = 0; changed.push(cur); } }
    let pulled = 0;
    for (const r of out.changes || []) {
      const cur = S.recs.get(r.id);
      if (!cur || r.updated_at > cur.updated_at) { const x = {...r, dirty: 0}; S.recs.set(x.id, x); changed.push(x); pulled++; }
    }
    if (changed.length) await IDB.putMany(changed);
    S.meta.lastPull = out.serverTime; S.meta.lastSync = Date.now(); S.meta.lastError = '';
    await IDB.setMeta('lastPull', out.serverTime); await IDB.setMeta('lastSync', S.meta.lastSync); await IDB.setMeta('lastError', '');
    if (manual) toast('Synced with cloud backup');
    if (pulled && !document.querySelector('main form:focus-within')) render();
  } catch (e) {
    S.meta.lastError = e.message || String(e); await IDB.setMeta('lastError', S.meta.lastError);
    if (manual) toast('Sync failed: ' + S.meta.lastError);
  } finally { syncing = false; setPill(); if (S.tab === 'settings' && manual) render(); }
}
addEventListener('online', () => sync(false));
addEventListener('offline', () => setPill());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(false); });
setInterval(() => sync(false), 5 * 60 * 1000);

/* ================= boot ================= */
(async function boot(){
  await IDB.open();
  for (const k of ['syncUrl', 'token', 'lastPull', 'lastSync', 'lastError', 'seeded']) S.meta[k] = await IDB.getMeta(k);
  (await IDB.all()).forEach(r => S.recs.set(r.id, r));
  if (!S.meta.seeded) {
    const fresh = SEED.filter(s => !S.recs.has(s.id)).map(s => ({...s, updated_at: 1, deleted: 0, dirty: 1}));
    fresh.forEach(r => S.recs.set(r.id, r)); if (fresh.length) await IDB.putMany(fresh);
    await IDB.setMeta('seeded', true); S.meta.seeded = true;
  }
  render(); setPill();
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const had = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!had || reloaded || document.querySelector('main form:focus-within')) return; reloaded = true; location.reload(); });
    navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {});
  }
  sync(false);
})();
